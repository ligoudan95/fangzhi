name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # TS 数值验收基准（docs/13 §6）：导表 + 15 项测试，必须全绿
  ts:
    name: TS export + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Export tables
        run: npm run export
      - name: Run tests
        run: npm test

  # GDScript 侧 lint：分层依赖方向 + gdformat/gdlint（D14 起强制阻断）
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"
      - name: Dependency direction check
        shell: pwsh
        run: pwsh -NoProfile -File tools/dep_check.ps1
      - name: gdformat check
        run: find scripts tests -name '*.gd' ! -path 'scripts/config/config_types.gd' -print0 | xargs -0 gdformat --check
      - name: gdlint
        run: gdlint scripts tests

  # GdUnit4 单测（docs/13 §12）：64 项（TS 断言口径平移 + 战斗/掉落/存档/设置加强项），强制阻断
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot headless
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Build import/class caches
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --import
      - name: Run GdUnit4 tests
        env:
          GODOT_BIN: "${{ github.workspace }}/Godot_v4.7.1-stable_linux.x86_64"
        run: |
          set +e
          # 不经 runtest.sh：其以非 headless 起 Godot（-d --remote-debug），无显示的 Linux runner 直接失败；
          # 此处与本地 tools/check_all.ps1 第 6 步完全同路径（-s GdUnitCmdTool + --headless + --ignoreHeadlessMode）
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . \
            -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a tests/ --ignoreHeadlessMode 2>&1 | tee gdunit.log
          status=${PIPESTATUS[0]}
          # 失败行转注解：日志 API 需权限，注解公开可读（诊断用，问题定位后可移除）
          grep -aE "FAILED|SCRIPT ERROR|Runtime Error|Expecting|Parse Error" gdunit.log | head -40 | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | cut -c1-250)
            echo "::error title=GdUnit::$safe"
          done
          exit $status

  # 引擎对拍（docs/13 §6）：TS 基准生成期望日志，GDScript 同种子逐行 diff——阻塞级
  parity:
    name: Engine parity (TS vs GDScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate expected logs (TS engine)
        run: npm run parity
      - name: Download Godot headless
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Run GDScript parity
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --import
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . -s res://tests/parity_runner.gd

  # Android APK（docs/13 §11）：debug 签名出包 → artifact，供真机竖屏验证安装
  # 真机验证清单通过后去掉 continue-on-error 转强制
  android-apk:
    name: Android APK (debug artifact)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Export and sync config
        run: npm run sync:godot
      - name: Verify generated config has no drift
        run: git diff --exit-code -- resources/config scripts/config/config_types.gd docs/fields.md
      - name: Download Godot
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.1.stable
          key: godot-export-templates-4.7.1-stable
      - name: Install export templates
        run: |
          if [ ! -f ~/.local/share/godot/export_templates/4.7.1.stable/android_release.apk ]; then
            curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz"
            mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
            unzip -q templates.tpz -d _tpl
            mv _tpl/templates/* ~/.local/share/godot/export_templates/4.7.1.stable/
          fi
      - name: Import project
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --import
      - name: Create debug keystore
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 9999 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Write Godot editor settings (Android SDK + keystore)
        run: |
          mkdir -p ~/.local/share/godot
          cat > ~/.local/share/godot/editor_settings-4.7.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = "${{ github.workspace }}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Export debug APK
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . \
            --export-debug "Android" build/android/fangzhi-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fangzhi-debug-apk
          path: build/android/fangzhi-debug.apk
